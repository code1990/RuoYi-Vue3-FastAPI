<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bean Dance v3</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; overflow: hidden; background: #d9f5fb; font-family: system-ui, sans-serif; }
    svg { width: min(960px, 100vw); height: auto; }
    .bean { transform-box: fill-box; transform-origin: center bottom; animation: dance .75s ease-in-out infinite alternate; }
    .bean.two { animation-delay: -.25s; animation-duration: .64s; }
    .bean.three { animation-delay: -.48s; animation-duration: .84s; }
    .note { transform-box: fill-box; transform-origin: center; animation: float 1.2s ease-in-out infinite alternate; }
    .note.n2 { animation-delay: -.5s; }
    @keyframes dance { to { translate: 0 -31px; rotate: 7deg; } }
    @keyframes float { to { translate: 0 -18px; rotate: 12deg; } }
  </style>
</head>
