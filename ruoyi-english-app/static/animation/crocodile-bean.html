<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bean with Crocodile</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #d8f4ff; font-family: system-ui, sans-serif; overflow: hidden; }
    svg { width: min(960px, 100vw); height: auto; }
    .bean { transform-box: fill-box; transform-origin: center; animation: bounce 1s ease-in-out infinite alternate; }
    .arm { transform-box: fill-box; transform-origin: 10% 15%; animation: wave .7s ease-in-out infinite alternate; }
    .sparkle { animation: twinkle 1s ease-in-out infinite alternate; }
    @keyframes bounce { to { translate: 0 -15px; rotate: 4deg; } }
    @keyframes wave { to { rotate: 13deg; } }
    @keyframes twinkle { to { opacity: .2; scale: .65; } }
  </style>
</head>

</html>
